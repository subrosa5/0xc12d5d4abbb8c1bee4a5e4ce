name: native builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb
      - run: python -m pip install uv==0.13.5
      - run: uv sync --locked --group build --python python
      - run: uv run --group build python tools/build_native.py
      - name: Native smoke tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a uv run --group build python tools/smoke_native.py --cli dist/native/x12 --recover dist/native/x12-recover --desktop dist/native/x12-desktop
      - name: Native smoke tests (macOS)
        if: runner.os == 'macOS'
        run: uv run --group build python tools/smoke_native.py --cli dist/native/x12 --recover dist/native/x12-recover --desktop dist/native/x12-desktop
      - run: uv run --group build python tools/package_native.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-${{ runner.os }}-${{ runner.arch }}
          path: dist/x12-native-*.zip
          if-no-files-found: error
